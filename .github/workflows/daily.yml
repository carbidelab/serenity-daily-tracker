name: Daily Serenity tracker
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '13 8,14,20 * * *'
      timezone: 'Asia/Seoul'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: serenity-pages
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt "yfinance>=0.2.60"
      - name: Collect latest third-party archive snapshot
        run: python scripts/update.py
        continue-on-error: true
      - name: Enrich with end-of-day prices (optional)
        run: python scripts/enrich_prices.py
        continue-on-error: true
      - name: Translate English summaries to Korean (best effort)
        run: |
          python -m pip install 'deep-translator>=1.11,<2'
          python scripts/translate_summaries.py
        continue-on-error: true
      - name: Save observations to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/tracker.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update Serenity observations'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
